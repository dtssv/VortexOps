# log-proxy 边缘日志代理（DaemonSet，部署在每个被管业务集群）
# 用法: 在每个被管业务集群执行 kubectl apply -f manifests/log-proxy/log-proxy-daemonset.yaml
#
# 部署位置：被管业务集群（非管理集群）
# 作用：接收平台转发的日志/exec 请求，本地直接调 kubelet，避免长连接汇聚平台
---
apiVersion: v1
kind: Namespace
metadata:
  name: vortexops-edge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vortexops-log-proxy
  namespace: vortexops-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vortexops-log-proxy
rules:
  # Pod 日志 / exec / 端口转发
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "pods/portforward"]
    verbs: ["get", "list", "watch"]
  # 事件
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # 节点（资源视图）
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vortexops-log-proxy
subjects:
  - kind: ServiceAccount
    name: vortexops-log-proxy
    namespace: vortexops-edge
roleRef:
  kind: ClusterRole
  name: vortexops-log-proxy
  apiGroup: rbac.authorization.k8s.io
---
# DaemonSet：每节点一个 Pod，就近接入同节点 Pod 的日志/exec
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vortexops-log-proxy
  namespace: vortexops-edge
spec:
  selector:
    matchLabels:
      app: vortexops-log-proxy
  template:
    metadata:
      labels:
        app: vortexops-log-proxy
    spec:
      serviceAccountName: vortexops-log-proxy
      tolerations:
        - operator: Exists       # 容忍所有污点，确保每个节点都部署
      containers:
        - name: log-proxy
          image: registry.vortexops.io/vortexops/log-proxy:1.0.0
          args:
            - serve
            - --listen=:8080
            - --platform-endpoint=https://api.vortexops.internal
            - --cluster-id=$(CLUSTER_ID)
            - --node-name=$(NODE_NAME)
          env:
            - name: CLUSTER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8080       # 节点端口，平台经 NodePort / LoadBalancer 访问
          resources:
            requests: { cpu: "0.1", memory: "128Mi" }
            limits:   { cpu: "0.5", memory: "512Mi" }
          # 限流：单节点并发上限
          envFrom:
            - configMapRef:
                name: log-proxy-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-proxy-config
  namespace: vortexops-edge
data:
  # 限流配置
  MAX_CONCURRENT_LOG_STREAMS: "20"
  MAX_CONCURRENT_EXEC_SESSIONS: "5"
  MAX_LOG_STREAM_DURATION_SECONDS: "1800"     # 30min
  # 缓存配置
  LOG_CACHE_SIZE_MB: "100"
---
# Service：暴露给平台访问（通过 NodePort 或 LoadBalancer）
apiVersion: v1
kind: Service
metadata:
  name: vortexops-log-proxy
  namespace: vortexops-edge
spec:
  type: NodePort
  selector:
    app: vortexops-log-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
