# 模型权重共享 PVC（RWX，多副本只读挂载）
# 用法: kubectl apply -f manifests/gpu/shared-weights-pvc.yaml -n vortexops
#
# 作用：首次部署下载权重到 PVC，后续副本/重启直接挂载，秒级就绪
# StorageClass 需支持 RWX（如 CephFS / NFS / 阿里云 NAS / AWS EFS）
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights-shared
  namespace: vortexops
  labels:
    app.kubernetes.io/name: model-weights
spec:
  accessModes:
    - ReadWriteMany              # 多 Pod 同时只读挂载
  storageClassName: shared-readonly
  resources:
    requests:
      storage: 5Ti               # 多个模型版本共存
---
# 权重下载 Job（首次部署用，从对象存储拉取权重到 PVC）
apiVersion: batch/v1
kind: Job
metadata:
  name: download-model-weights
  namespace: vortexops
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: amazon/aws-cli:2.15.0
          command:
            - /bin/sh
            - -c
            - |
              # 从对象存储下载权重到共享 PVC
              aws s3 sync s3://vortexops-model-weights/${MODEL_NAME}/${MODEL_VERSION} /models/${MODEL_NAME}/${MODEL_VERSION} \
                --endpoint-url ${S3_ENDPOINT} \
                --no-sign-request || \
              aws s3 sync s3://vortexops-model-weights/${MODEL_NAME}/${MODEL_VERSION} /models/${MODEL_NAME}/${MODEL_VERSION} \
                --endpoint-url ${S3_ENDPOINT}
              echo "[download] 权重下载完成: /models/${MODEL_NAME}/${MODEL_VERSION}"
              ls -lh /models/${MODEL_NAME}/${MODEL_VERSION}/
          env:
            - name: MODEL_NAME
              value: "Qwen2.5-72B-Instruct"
            - name: MODEL_VERSION
              value: "v1.0"
            - name: S3_ENDPOINT
              value: "https://s3.us-east-1.vortexops.io"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: secretKey
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          volumeMounts:
            - name: model-weights
              mountPath: /models
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights-shared
