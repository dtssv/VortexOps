# VortexOps K8s 集群配置（kind 单节点 control-plane）
# 用于 docker-compose 中 kindest/node 容器初始化 K8s 集群。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vortexops
nodes:
  - role: control-plane
    # 暴露 NodePort 范围到宿主机：与 docker-compose k3s 的 --service-node-port-range 对齐
    # （30000-30099）。分组网络模式设为 nodeport 时，分配到的端口必然在此范围内，
    # 可通过 宿主机IP:NodePort 直接访问。
    # 注意：kind 的 extraPortMappings 逐条映射，这里用 jq/脚本生成的 100 条；
    # 若手改请保持 containerPort == hostPort，且落在 service-node-port-range 内。
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
      - containerPort: 30001
        hostPort: 30001
      - containerPort: 30002
        hostPort: 30002
      - containerPort: 30003
        hostPort: 30003
