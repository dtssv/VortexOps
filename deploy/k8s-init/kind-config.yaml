networking:
  apiServerAddress: 0.0.0.0
  apiServerPort: 6443
kubeadmConfigPatches:
  # 限制 service-node-port-range 与 extraPortMappings 一致（30000-30099），
  # 确保分组 nodeport 模式分配到的端口必然在宿主机映射范围内。
  - |-
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        service-node-port-range: 30000-30099
      certSANs:
        - host.docker.internal
        - localhost
        - 127.0.0.1
containerdConfigPatches:
  # 开启 insecure registry（允许从 Harbor 拉取镜像）
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."harbor-core:8080"]
      endpoint = ["http://harbor-core:8080"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."harbor-core:8080".auth]
      username = "admin"
      password = "Harbor12345"
  # 开发环境 registry（compose 内 registry:5000，宿主机 8083）。
  # kind 节点通过 host.docker.internal:8083 拉取 VortexOps 构建推送的镜像。
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."host.docker.internal:8083"]
      endpoint = ["http://host.docker.internal:8083"]
