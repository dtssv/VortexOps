# keepalived 配置：VortexOps 入口 VIP
# 部署位置：/etc/keepalived/keepalived.conf
# 两台负载均衡节点：一主一备，VIP 自动切换
#
# 主节点 state=MASTER，priority=100
# 备节点 state=BACKUP，priority=90

global_defs {
    router_id VORTEXOPS_LB
    enable_script_security
}

vrrp_script check_nginx {
    script "/usr/bin/curl -sf http://127.0.0.1/healthz"
    interval 2
    fall 2
    rise 2
    weight -20
}

vrrp_instance VI_VORTEXOPS {
    state MASTER              # 备节点改 BACKUP
    interface eth0            # 物理网卡名，按需修改
    virtual_router_id 51
    priority 100              # 备节点改 90
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_KEEPALIVED_PASSWORD
    }
    virtual_ipaddress {
        192.168.1.100/24      # VIP，所有域名解析到此 IP
    }
    track_script {
        check_nginx
    }
    notify_master "/usr/local/bin/keepalived-notify.sh MASTER"
    notify_backup "/usr/local/bin/keepalived-notify.sh BACKUP"
    notify_fault  "/usr/local/bin/keepalived-notify.sh FAULT"
}
