# VortexOps Nginx 反向代理配置（物理机方案）
# 部署位置：/etc/nginx/conf.d/vortexops.conf
#
# 关键点：
#   - SSE 长连接：关闭 proxy_buffering，增大 proxy_read_timeout
#   - WebSocket：Upgrade + Connection，ip_hash sticky session
#   - TLS 1.2+，启用 HSTS、HTTP/2

# ---------- 上游：apiserver 集群 ----------
upstream vortexops_apiserver {
    least_conn;
    server 192.168.1.11:8080 max_fails=3 fail_timeout=30s;
    server 192.168.1.12:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---------- 上游：ws-gateway 集群 ----------
upstream vortexops_ws_gateway {
    ip_hash;       # sticky session
    server 192.168.1.11:8081 max_fails=3 fail_timeout=30s;
    server 192.168.1.12:8081 max_fails=3 fail_timeout=30s;
}

# ---------- 上游：ext-api-gw ----------
upstream vortexops_ext_api {
    least_conn;
    server 192.168.1.13:8080 max_fails=3 fail_timeout=30s;
}

# ---------- 上游：frontend ----------
upstream vortexops_frontend {
    server 192.168.1.11:8088;
    server 192.168.1.12:8088;
}

# ---------- HTTP → HTTPS 跳转 ----------
server {
    listen 80;
    server_name vortexops.internal api.vortexops.internal ext.vortexops.internal ws.vortexops.internal;
    return 301 https://$host$request_uri;
}

# ---------- 前端 UI ----------
server {
    listen 443 ssl;
    http2 on;
    server_name vortexops.internal;

    ssl_certificate     /etc/ssl/certs/vortexops.pem;
    ssl_certificate_key /etc/ssl/private/vortexops-key.pem;
    include /etc/nginx/conf.d/tls.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://vortexops_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- 内部 API（含 SSE） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.vortexops.internal;

    ssl_certificate     /etc/ssl/certs/vortexops.pem;
    ssl_certificate_key /etc/ssl/private/vortexops-key.pem;
    include /etc/nginx/conf.d/tls.conf;

    client_max_body_size 100m;

    location / {
        proxy_pass http://vortexops_apiserver;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }
}

# ---------- 对外 API ----------
server {
    listen 443 ssl;
    http2 on;
    server_name ext.vortexops.internal;

    ssl_certificate     /etc/ssl/certs/vortexops.pem;
    ssl_certificate_key /etc/ssl/private/vortexops-key.pem;
    include /etc/nginx/conf.d/tls.conf;

    # 对外 API 限流：每 Token 60 req/min
    limit_req_zone $http_authorization zone=ext_api_limit:10m rate=1r/s;

    location / {
        limit_req zone=ext_api_limit burst=60 nodelay;
        proxy_pass http://vortexops_ext_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- WebSocket ----------
server {
    listen 443 ssl;
    http2 on;
    server_name ws.vortexops.internal;

    ssl_certificate     /etc/ssl/certs/vortexops.pem;
    ssl_certificate_key /etc/ssl/private/vortexops-key.pem;
    include /etc/nginx/conf.d/tls.conf;

    location / {
        proxy_pass http://vortexops_ws_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS 长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
