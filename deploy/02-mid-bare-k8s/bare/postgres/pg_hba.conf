# PostgreSQL 客户端访问控制
# 部署位置：/etc/postgresql/16/main/pg_hba.conf
#
# 原则：默认拒绝；仅放行明确来源

# TYPE   DATABASE     USER           ADDRESS                METHOD         OPTIONS
# ---------- 本地 ----------
local    all          postgres                              peer
local    all          vortexops                             peer
local    replication  replication                           peer

# ---------- 复制（从库 → 主库）----------
host     replication  replication    192.168.1.21/32         scram-sha-256
host     replication  replication    192.168.1.22/32         scram-sha-256

# ---------- PgBouncer（apiserver / syncer 经 PgBouncer 接入）----------
host     vortexops    vortexops      192.168.1.30/32         scram-sha-256
host     vortexops    vortexops      192.168.1.31/32         scram-sha-256

# ---------- 直连（仅 admin 运维用） ----------
# host     vortexops    vortexops      192.168.1.0/24          scram-sha-256

# ---------- 备份 / 监控 ----------
host     vortexops    vortexops      192.168.1.40/32         scram-sha-256   # pgBackRest
host     all          pgmonitor      192.168.1.41/32         scram-sha-256   # Prometheus exporter

# ---------- 默认拒绝 ----------
# host     all          all            0.0.0.0/0               reject
