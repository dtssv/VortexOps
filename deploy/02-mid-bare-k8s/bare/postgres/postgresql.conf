# PostgreSQL 16 主配置（物理机方案，含 pgvector / pg_trgm）
# 部署位置：/etc/postgresql/16/main/postgresql.conf
# 主从复制：主库 wal_level=replica，从库 hot_standby=on

# ---------- 连接 ----------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 10
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# ---------- 内存 ----------
shared_buffers = 4GB                # 物理内存 1/4
effective_cache_size = 12GB         # 物理内存 3/4
work_mem = 32MB
maintenance_work_mem = 1GB
autovacuum_work_mem = 512MB

# ---------- WAL / 复制 ----------
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
synchronous_commit = on
synchronous_standby_names = '*'     # 同步复制（RPO≈0）
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 2GB
archive_mode = on
archive_command = 'aws s3 cp %p s3://vortexops-backups/postgres/wal/%f --endpoint-url http://minio.vortexops.internal:9000'
archive_timeout = 60s

# ---------- 查询计划 ----------
random_page_cost = 1.1               # SSD
effective_io_concurrency = 200
default_statistics_target = 200

# ---------- 自动维护 ----------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# ---------- 扩展 ----------
shared_preload_libraries = 'vector,pg_trgm'

# ---------- 日志 ----------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500     # 慢查询阈值 500ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %u@%d %h '
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ---------- 并行查询 ----------
max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_workers = 16
max_parallel_maintenance_workers = 4

# ---------- 时区 / 字符集 ----------
timezone = 'Asia/Shanghai'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
